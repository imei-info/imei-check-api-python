[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imei-info"
version = "5.0.0"
description = "The official, modern, fully typed Python SDK for the IMEI.info API v5."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "IMEI.info Team", email = "api@imei.info" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.20.0,<1.0.0",
]

[project.urls]
Homepage = "https://www.imei.info/api/imei/docs/"
Documentation = "https://dash.imei.info/swagger/"
Repository = "https://github.com/imei-info/imei-info-python"
"Bug Tracker" = "https://github.com/imei-info/imei-info-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/imei_info"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
